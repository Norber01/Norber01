<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8931a">
  <meta name="description" content="Fresh farm eggs: see how many crates are available and the price per crate.">
  <title>Fresh Eggs</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #15130f;
      --surface: #221d12;
      --line: #3d3420;
      --text: #f4efe3;
      --muted: #b9ad92;
      --orange: #c8931a;
      --orange-strong: #e0a526;
      --orange-ink: #1b1405;
      --green: #5fd38a;
      --red: #ff6b5e;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header {
      background: var(--orange);
      color: var(--orange-ink);
      padding: 18px 16px;
      padding-top: calc(18px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 2px 0 0; font-size: .9rem; opacity: .85; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--orange);
      border-radius: var(--radius);
      padding: 16px;
    }
    .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .big { font-size: 2.6rem; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .big.ok { color: var(--green); }
    .big.out { color: var(--red); font-size: 1.8rem; }
    .extra { color: var(--muted); margin-top: 6px; font-size: .95rem; }
    .price { color: var(--orange-strong); }
    .desc { white-space: pre-wrap; line-height: 1.5; margin: 6px 0 0; overflow-wrap: anywhere; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; text-decoration: none;
      background: var(--orange); color: var(--orange-ink);
    }
    .btn.wa { background: #25d366; color: #062b14; }
    #contact { display: flex; flex-direction: column; gap: 12px; }
    .number { color: var(--muted); font-size: .9rem; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
    .updated, .note { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }
    .message { text-align: center; color: var(--muted); padding: 40px 16px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="icon.svg" alt="" width="40" height="40">
    <div>
      <h1 id="farmName">Fresh Farm Eggs</h1>
      <p>Eggs available now</p>
    </div>
  </header>

  <main>
    <p class="message" id="message">Loading…</p>

    <div id="shop" hidden>
      <div class="card">
        <div class="label">Available now</div>
        <div class="big" id="available"></div>
        <div class="extra" id="availableExtra"></div>
      </div>
    </div>

    <div class="card" id="priceCard" hidden>
      <div class="label">Price per crate</div>
      <div class="big price" id="price"></div>
      <div class="extra" id="crateSize"></div>
    </div>

    <div class="card" id="descCard" hidden>
      <div class="label">About our eggs</div>
      <p class="desc" id="description"></p>
    </div>

    <div id="contact" hidden></div>

    <p class="updated" id="updated"></p>
  </main>

  <script src="firebase-config.js?v=14"></script>
  <script src="shop.js?v=14"></script>
</body>
</html>
